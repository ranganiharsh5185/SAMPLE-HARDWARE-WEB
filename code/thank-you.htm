<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | BuildPro Hardware</title>
    <style>
      :root {
        --bg: #eef8f7;
        --text: #17363a;
        --muted: #55727a;
        --accent: #0f766e;
        --accent-dark: #0b4f4a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #f4fffc, #eef8f7);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .box {
        background: white;
        border: 1px solid #cfe7e4;
        border-radius: 22px;
        padding: 32px;
        max-width: 560px;
        text-align: center;
        box-shadow: 0 12px 34px rgba(15, 118, 110, 0.12);
      }
      h1 { font-size: 1.9rem; margin-bottom: 10px; }
      p { color: var(--muted); margin-bottom: 16px; }
      a {
        display: inline-block;
        padding: 11px 16px;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
      img { max-width: 100%; height: auto; display: block; }
      @media (max-width: 768px) { .box { padding: 24px; } }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Thank you for your enquiry!</h1>
      <p>Your message has been sent successfully. We will get back to you shortly.</p>
      <a href="home.htm">Back to Home</a>
    </div>
  </body>
</html>
